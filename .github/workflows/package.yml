name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: norm
        uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.23
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 25.0.2
      - uses: actions/checkout@v7
        with:
          repository: normlanguage/ui
          ref: v11
          path: .tmp/ui
      - name: Build component artifact
        shell: pwsh
        run: |
          ./gradlew.bat publish '-PuiRoot=.tmp/ui' --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path $HOME '.norm/cache/maven'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item -Path build/repository/* -Destination $cache -Recurse -Force
          $gallery = 'dev/normlanguage/ui-desktop-gallery/3/ui-desktop-gallery-3.jar'
          Get-FileHash (Join-Path 'build/repository' $gallery)
          Get-FileHash (Join-Path $cache $gallery)
          norm resolve samples/gallery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-maven-artifact
          path: build/repository/dev/normlanguage/ui-desktop-gallery/3
      - name: Generate repository Skill
        shell: pwsh
        run: norm docs ui/desktop/kit --output build/api --skill SKILL.md
      - uses: normlanguage/registry/.github/actions/package-module@90b4d247fa4f5f2b620924d2cbc0553e89843700
        id: package
        with:
          module-path: ui/desktop/kit
          cache-directory: ~/.norm/cache/packages/github
      - name: Verify JavaFX components and theme rendering
        shell: pwsh
        env:
          NORM_EXECUTABLE: ${{ steps.norm.outputs.executable }}
        run: |
          ./gradlew.bat test '-PuiRoot=.tmp/ui' --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify component lifecycle and gallery
        shell: bash
        run: |
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.tabs
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.creation
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.workbench
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.inputs
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.display
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.navigation
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.feedback
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.password
          timeout 300 norm test samples/tasks
          timeout 300 norm test samples/orders
          timeout 300 norm test samples/jobs
          timeout 300 norm test samples/gallery --filter gallery.test.catalog
          timeout 900 norm test samples/gallery --filter gallery.test.rendering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-screenshots
          path: build/screenshots/norm
      - uses: normlanguage/registry/.github/actions/publish-module@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          archive: ${{ steps.package.outputs.archive }}
          version: ${{ steps.package.outputs.version }}








